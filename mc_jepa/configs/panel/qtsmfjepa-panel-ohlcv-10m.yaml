# Factorized panel JEPA (target_mode: factorized) on 1-min v4 OHLCV panels: one sample is one decision time with every
# eligible stock. Same encoder, lookback and times of day as qtsmfjepa-series-ohlcv-10m, so the two compare directly.
# launch: torchrun --nproc_per_node=2 -m mc_jepa.trainer.panel_jepa_trainer --config-name=qtsmfjepa-panel-ohlcv-10m
timestamp: null  # experiment id, defaults to the launch time

data:
  format: panel  # CrossSectionPanelDataset (v4)
  seed: 666
  features: [open, high, low, close, volume]
  # context bars (4 trading days); a multiple of model.patch_len, at most model.max_patches patches.
  lookback: 960
  # decision HHMMSS to keep: every 10 min from 09:40 (24 panels per day); null keeps every bar.
  times_of_day: [
    94000, 95000, 100000, 101000, 102000, 103000, 104000, 105000, 110000, 111000, 112000, 113000,
    131000, 132000, 133000, 134000, 135000, 140000, 141000, 142000, 143000, 144000, 145000, 150000,
  ]
  min_symbols: 50  # drop decision times with fewer eligible stocks
  # a stock's own lookback (lookahead) bars may spread over span_ratio x as many market timestamps, so halts and
  # minutes without trades do not drop it; 1 keeps only stocks with no missing bar in the window (~85% of the
  # stocks trading at t, 2016-2024), 2 keeps ~95%
  span_ratio: 1.0
  mmap_warmup: false
  daily_dir: null  # tools/daily_bars.py table, needed with model.daily_lookback
  num_workers: 10
  # future blocks reach model.horizons[-1] + model.target_block_len - 1 bars past each decision time: keep at
  # least that many bars between train.end_timestamp and val.start_timestamp as an embargo
  # splits: train before 2022-07, eval 2022-07..2022-12, test 2023-01..2025-12 (never used in pretraining)
  train:
    prefix: /path/to/mmap-v4/1min/train-ohlcv
    start_timestamp: null
    end_timestamp: 20220701000000
    symbols: null  # list or file of symbols to train on; hold stocks out for the unseen-stock test
    max_symbols: 1024  # random stocks kept per panel, bounds memory
  val:
    prefix: ${data.train.prefix}
    start_timestamp: 20220711000000
    end_timestamp: 20230101000000  # 2023-2025 is the held-out test period (tools/eval_jepa_probe.py)
    times_of_day: [100000, 103000, 110000, 113000, 133000, 140000, 143000, 150000]  # overrides data.times_of_day
    symbols: null
    max_symbols: 1024  # fixed per decision time across validations
  # panels (decision times) per optimizer step, over all ranks (8k windows); 43.6k train panels, so 20k steps is
  # ~3.7 epochs. One panel costs ~13 GB at micro-batch 1 on an H800; micro-batch 4 fits in ~50 GB at ~0.35 s/step
  train_batch_size: 8
  micro_batch_size_per_gpu: 4
  total_training_steps: 20000

optim:
  type: adamw
  lr: 3e-4
  min_lr_ratio: 0.0
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_steps_ratio: null
  warmup_steps: 1000
  clip_grad: 1.0
  lr_scheduler: cosine

model:
  name: qtsmfjepa
  in_features: null  # set to len(data.features)
  patch_len: 10
  max_patches: 96  # data.lookback / patch_len
  input_clip: 10.0
  readout: cls  # cls | mean: the stock state for z_i, the EMA targets and the probe
  hidden_size: 256
  num_hidden_layers: 12
  num_attention_heads: 8
  intermediate_size: 1024
  hidden_act: gelu
  hidden_dropout_prob: 0.0
  attention_probs_dropout_prob: 0.0
  layer_norm_eps: 1e-6
  initializer_range: 0.02
  num_market_tokens: 4
  panel_mlp_layers: 2
  predictor_layers: 2
  horizons: [1, 60, 240]  # target block starts, in bars after the decision time
  target_block_len: 30
  target_mode: factorized  # factorized | unfactorized | single
  use_peer_context: true  # false: asset-only control
  market_loss_weight: 1.0
  stock_loss_weight: 1.0
  loss_stats_momentum: 0.99
  ema_momentum: 0.996
  ema_momentum_end: 1.0
  # per-window scale token for both encoders: context scale (online), future block scale (target)
  scale_token: false
  target_scale: block
  scale_aux_weight: 0.0
  target_window: block  # block | end: target_block_len bars starting / ending at t+h
  target_norm: context  # context | self: future blocks z-scored by the context's or their own stats
  # stock head also scored given the realized leave-one-out market target (market-conditioned JEPA):
  # none | loo_mean; loss = (1 - condition_weight) * unconditional + condition_weight * conditional
  market_condition: none
  condition_weight: 1.0
  condition_dim: 32  # bottleneck of the market condition
  stacked_linear_act: false  # hidden_act between back-to-back linears (condition bottleneck, loadings / scale heads)
  condition_predictor: shared  # shared: P(z, Wc, h) | separate: P_u(z, h), P_c(z, Wc, h) | factor: a(z, h) + B(z, h) g(c), the condition only via loadings B
  factor_stop_base: false  # factor: the conditional pass is sg(a) + B g(c), so a sees only the unconditional loss
  factor_loadings: mlp  # factor: mlp B = Linear(P(z, h)) | linear B = W_h z + b_h, linear in z
  condition_heads: 4  # attention heads of market_condition=peer_attn (learned peer attention, keys past, values future)
  condition_query: state  # peer_attn queries: state = from z_i | global = one learned query per head, shared by all stocks
  condition_ramp_start: 0  # condition_weight is 0 before this step, then rises linearly to it over condition_ramp_steps
  condition_ramp_steps: 0
  condition_placebo: false  # loo_mean only: each panel gets another panel's (another date's) c+, a placebo control
  # same-time InfoNCE: the stock prediction picks its own target among the panel's (panel-centered) targets
  contrastive_weight: 0.0
  contrastive_temperature: 0.1
  contrastive_neighbors: 0  # candidates: the K stocks nearest in context scale (0: the whole panel)
  peer_predict_weight: 0.0  # lead-lag: a random peer's state predicts what a stock's own prediction misses
  # SIGReg (LeJEPA): push the online states z_i towards N(0, I), tested on sigreg_slices random 1-D projections
  sigreg_weight: 0.0
  sigreg_slices: 256
  context_symbols: 0  # encode and score at most this many random stocks per panel (0: all); all enter the condition
  panel_mixer_layers: 0  # stock-stock attention layers over each panel's states, read by the stock head (0: off)
  freeze_encoder: false  # fixed encoders (e.g. trainer.init_encoder_from a series run); only mixer and heads train
  enable_gradient_checkpointing: false
  # daily bars before the decision date as a second, longer context for the online encoder (0: off); tokens of
  # daily_patch_len days (mc_jepa/datasets/daily.py)
  daily_lookback: 0
  daily_patch_len: 5
  daily_features: 6
  daily_feature_set: features-1  # features-1 | features-2 (mc_jepa/datasets/daily.py)

trainer:
  default_local_dir: null  # defaults to ./experiments/{project_name}-{timestamp}
  model_path: null  # continue from a saved global_step_* directory
  init_encoder_from: null  # global_step_* directory whose online / target encoders initialize this model
  init_model_from: null  # global_step_* directory whose weights all initialize this model (predictor inputs may widen)
  project_name: panel-qtsmfjepa-10m-202212-1min-ohlcv
  experiment_name: null  # set from timestamp
  logger: ["console", "tensorboard"]
  seed: ${data.seed}
  bf16: true
  save_freq: 2000
  test_freq: 1000
  diag_freq: 50  # collapse diagnostics every n steps
